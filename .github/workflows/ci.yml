name: CI
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

# Least privilege: nothing here writes to the repository. Deployment credentials are scoped
# to the main-only production job; pull requests run only the credential-free checks (F239).
permissions:
  contents: read

# A newer push to the same PR supersedes the running check. Pushes to main are never
# cancelled, so every merged commit keeps a complete CI record.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to a commit SHA, not a movable tag. Dependabot
      # (.github/dependabot.yml) proposes bumps; the trailing comment keeps them readable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the migration seal can read the base branch's migrations.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python3 scripts/test_auth_schema.py
      # Lifecycle scripts are off for every install (`--ignore-scripts`): the whole suite, build and integration job
      # pass without them (docs/SUPPLY_CHAIN.md). `npm ci` installs exactly the committed lockfile. Never `npm install`: it
      # re-resolves ranges, so a passing local build would not imply a passing CI build.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Production-dependency advisories (F239). Same policy as
      # `npm audit --omit=dev --audit-level=high`, plus a short dated exception list in
      # scripts/audit-gate.mjs that is mirrored in docs/SECURITY.md.
      - run: npm run audit:gate
      # Registry signatures and sigstore provenance attestations for every installed package (F239). It reads the
      # registry, so it needs network; a package that fails verification fails the job. Policy: docs/SUPPLY_CHAIN.md.
      - run: npm audit signatures
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:web
      - run: npm run build:web
      # Migrations are immutable once merged (F05): an edited, deleted, unsealed or duplicate-numbered file fails
      # here. On a pull request the tree is also compared with the base branch (content, sidecars, numbering), so
      # rewriting a file together with its sidecar fails too, and an unresolvable base ref is an error. Once main
      # carries the sidecars, add `--require-base` here. This only blocks a merge if branch protection requires
      # this job (docs/RELEASE_GATES.md).
      - run: npm run migrations:check
      - if: github.event_name == 'pull_request'
        run: node scripts/migration-seal.mjs --check --base "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
      # Runs every test and enforces the coverage floor in vitest.config.ts (F02).
      - run: npm run test:coverage
      # Guards the deployed Worker artifact against the pure-JS scrypt fallback, whose
      # digest comparison is not constant-time. Must run after install; see the script.
      - run: npm run verify:worker-bundle

  integration:
    # Separate from `verify` (F02): it runs the real `wrangler d1 migrations apply --local` (workerd) over the
    # whole chain from an empty database, then the 0026 finalize and recover scripts. No secrets, no network
    # and no Cloudflare account. It does not prove D1 overload or queue-concurrency behaviour, which local
    # mode does not emulate; those need the staging drill in docs/RELEASE_GATES.md.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:integration

  dependency-review:
    # Blocks a PR that introduces a dependency with a known high or critical advisory.
    # Runs only when the repository variable DEPENDENCY_REVIEW is 'true', i.e. after the
    # dependency graph is enabled (Settings → Code security). Until then it is skipped
    # rather than reported as a failing check that someone might mark required.
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Needs the repository's dependency graph. If it is disabled the action errors; that
    # must not block merges, so this job reports but does not gate until it is confirmed
    # working (docs/RELEASE_GATES.md). Remove `continue-on-error` once it has run green.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime

  deploy:
    name: Deploy production
    needs: [verify, integration]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://noti.runlumi.app
    permissions:
      contents: read
    concurrency:
      group: noti-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run predeploy
      - run: npm run build:web
      - run: node scripts/verify_worker_bundle.mjs --deploy
      # Check again after the build: an older CI run must never deploy over a newer main.
      - name: Check current main revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping superseded revision $GITHUB_SHA; main is $latest."
          fi
      # Only this step receives the Cloudflare credential. Runtime application secrets stay on the Worker.
      - name: Deploy checked revision and verify health
        if: steps.revision.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '73fe06de8746378768229a64680dd62f'
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN in the production environment before deploying."
            exit 1
          fi
          node scripts/check-deployment-migrations.mjs
          node_modules/.bin/wrangler deploy --config web/dist/server/wrangler.json --tag "$GITHUB_SHA"
          npm run smoke
